<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14293b" />
    <meta name="description" content="Auralia: primer prototipo interactivo de exploración, crafting y construcción." />
    <title>Auralia · El Valle de los Faroles</title>
    <link rel="stylesheet" href="/src/ui/loading.css" />
  </head>
  <body>
    <section id="loading-screen" class="loading-screen" data-stage="boot" aria-labelledby="loading-title" aria-busy="true">
      <div class="loading-border" aria-hidden="true"></div>
      <div class="loading-brand"><span>✦</span> AURALIA <span>✦</span><small>EL VALLE DE LOS FAROLES</small></div>
      <svg class="loading-landscape" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="dawn"><stop stop-color="#d9bc76" stop-opacity=".22"/><stop offset="1" stop-color="#152e30" stop-opacity="0"/></radialGradient>
          <linearGradient id="river" x2="0" y2="1"><stop stop-color="#64958b" stop-opacity=".05"/><stop offset="1" stop-color="#64958b" stop-opacity=".5"/></linearGradient>
        </defs>
        <ellipse cx="600" cy="320" rx="440" ry="300" fill="url(#dawn)"/>
        <circle cx="600" cy="237" r="64" fill="none" stroke="#dfc78e" stroke-opacity=".24"/>
        <path d="M0 400 150 230 229 298 360 150 455 285 540 225 670 355 800 190 900 290 1010 185 1200 390V600H0Z" fill="#254745"/>
        <path d="M0 455 220 360 356 405 470 305 560 408 690 360 820 432 1010 320 1200 430V600H0Z" fill="#1b3939"/>
        <path d="M0 470Q250 400 430 480T830 465T1200 480V600H0Z" fill="#102c2d"/>
        <path d="M620 465Q540 490 644 507T552 543T665 600H465Q562 554 508 539T580 501T620 465" fill="url(#river)"/>
        <g fill="#d9bd80" opacity=".65"><circle cx="495" cy="470" r="2"/><circle cx="480" cy="462" r="1.5"/><circle cx="705" cy="478" r="2"/><circle cx="726" cy="471" r="1.5"/></g>
        <path d="M95 600Q130 430 95 320M122 430 190 355M116 450 55 389M1080 600Q1050 430 1100 315M1068 450 1000 370M1080 413 1150 355" fill="none" stroke="#10272a" stroke-width="12"/>
        <g fill="#a78982" opacity=".5"><ellipse cx="80" cy="330" rx="63" ry="25"/><ellipse cx="150" cy="358" rx="68" ry="25"/><ellipse cx="50" cy="383" rx="50" ry="20"/><ellipse cx="1110" cy="325" rx="67" ry="28"/><ellipse cx="1030" cy="363" rx="62" ry="25"/><ellipse cx="1155" cy="365" rx="60" ry="23"/></g>
      </svg>
      <main class="loading-content">
        <div class="loading-lantern" aria-hidden="true"><svg viewBox="0 0 64 80"><path d="M27 15v-5a5 5 0 0 1 10 0v5M22 19h20l6 43H16l6-43Zm-2 7h24M18 54h28M24 62v5m16-5v5M32 27v24"/><path class="loading-flame" d="M32 33c-9 9-8 15 0 15s9-6 0-15Z"/></svg></div>
        <p class="loading-eyebrow">UN NUEVO VIAJE TE ESPERA</p>
        <h1 id="loading-title">Encendiendo los faroles</h1>
        <p id="loading-status" role="status" aria-live="polite">Preparando tu llegada al valle…</p>
        <div class="loading-progress-row"><div id="loading-progress" role="progressbar" aria-label="Preparación del mundo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="loading-fill"></span></div><span id="loading-percent" aria-hidden="true">0%</span></div>
        <p id="loading-note">Los caminos de Auralia comienzan bajo los cerezos de Brisalia.</p>
        <button id="loading-retry" type="button" hidden>Volver a intentar</button>
      </main>
      <footer class="loading-footer"><span>EXPLORÁ · DESCUBRÍ · CONSTRUÍ</span><small>Tu aventura está por comenzar</small></footer>
      <noscript>Activá JavaScript para entrar a Auralia.</noscript>
    </section>
    <div id="app" inert aria-hidden="true"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
